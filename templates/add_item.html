{% extends "base.html" %}
{% block title %}Add Item – Shop Manager{% endblock %}

{% block content %}
<div class="page-header">
  <h4><i class="bi bi-plus-circle me-2"></i>Add New Item</h4>
  <a href="{{ url_for('inventory_page') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i> Back to Inventory
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm" style="border-radius:14px;">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('add_item') }}">

          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Item Name</label>
            <input type="text" class="form-control" id="name" name="name"
                   placeholder="e.g. Apple, Bread, Rice..." required autofocus>
          </div>

          <div class="mb-3">
            <label for="price" class="form-label fw-semibold">Price per Unit (Rs.)</label>
            <div class="input-group">
              <span class="input-group-text">Rs.</span>
              <input type="number" class="form-control" id="price" name="price"
                     min="0" step="0.01" placeholder="0.00" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="quantity" class="form-label fw-semibold">Quantity in Stock</label>
            <input type="number" class="form-control" id="quantity" name="quantity"
                   min="0" step="1" placeholder="0" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-plus-circle me-2"></i>Add Item
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
